<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Student Management System</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef2f5;
    padding: 20px;
}

.container {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

h2 {
    text-align: center;
    margin-bottom: 10px;
}

.counter {
    text-align: center;
    margin-bottom: 15px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    padding: 10px 15px;
    margin-top: 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

.add-btn {
    background: #007bff;
    color: white;
}

.edit-btn {
    background: #ffc107;
}

.delete-btn {
    background: #dc3545;
    color: white;
}

.clear-btn {
    background: #6c757d;
    color: white;
    margin-left: 10px;
}

button:hover {
    opacity: 0.9;
}

.search {
    margin-top: 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th, td {
    padding: 10px;
    border: 1px solid #ddd;
    text-align: center;
}

th {
    background: #007bff;
    color: white;
}
</style>
</head>

<body>

<div class="container">
    <h2>Student Management System</h2>

    <div class="counter">
        Total Students: <span id="total">0</span>
    </div>

    <input type="text" id="name" placeholder="Student Name">
    <input type="text" id="roll" placeholder="Roll Number">
    <input type="text" id="course" placeholder="Course">

    <button class="add-btn" id="saveBtn" onclick="addStudent()">Add Student</button>
    <button class="clear-btn" onclick="clearAll()">Clear All</button>

    <input type="text" class="search" id="search" placeholder="Search by Name or Roll" onkeyup="searchStudent()">

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Roll No</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentList"></tbody>
    </table>
</div>

<script>
let students = JSON.parse(localStorage.getItem("students")) || [];
let editIndex = -1;

displayStudents();

function addStudent() {
    let name = document.getElementById("name").value;
    let roll = document.getElementById("roll").value;
    let course = document.getElementById("course").value;

    if (name === "" || roll === "" || course === "") {
        alert("Please fill all fields");
        return;
    }

    if (editIndex === -1) {
        let exists = students.some(s => s.roll === roll);
        if (exists) {
            alert("Roll number already exists");
            return;
        }
        students.push({ name, roll, course });
    } else {
        students[editIndex] = { name, roll, course };
        editIndex = -1;
        document.getElementById("saveBtn").innerText = "Add Student";
    }

    localStorage.setItem("students", JSON.stringify(students));
    clearInputs();
    displayStudents();
}

function displayStudents(list = students) {
    let table = document.getElementById("studentList");
    table.innerHTML = "";

    list.forEach((student, index) => {
        table.innerHTML += `
        <tr>
            <td>${student.name}</td>
            <td>${student.roll}</td>
            <td>${student.course}</td>
            <td>
                <button class="edit-btn" onclick="editStudent(${index})">Edit</button>
                <button class="delete-btn" onclick="deleteStudent(${index})">Delete</button>
            </td>
        </tr>`;
    });

    document.getElementById("total").innerText = students.length;
}

function editStudent(index) {
    document.getElementById("name").value = students[index].name;
    document.getElementById("roll").value = students[index].roll;
    document.getElementById("course").value = students[index].course;
    editIndex = index;
    document.getElementById("saveBtn").innerText = "Update Student";
}

function deleteStudent(index) {
    if (confirm("Delete this student?")) {
        students.splice(index, 1);
        localStorage.setItem("students", JSON.stringify(students));
        displayStudents();
    }
}

function clearAll() {
    if (confirm("Clear all records?")) {
        students = [];
        localStorage.removeItem("students");
        displayStudents();
    }
}

function searchStudent() {
    let keyword = document.getElementById("search").value.toLowerCase();
    let filtered = students.filter(s =>
        s.name.toLowerCase().includes(keyword) ||
        s.roll.toLowerCase().includes(keyword)
    );
    displayStudents(filtered);
}

function clearInputs() {
    document.getElementById("name").value = "";
    document.getElementById("roll").value = "";
    document.getElementById("course").value = "";
}
</script>

</body>
</html>
